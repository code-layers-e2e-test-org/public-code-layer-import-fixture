<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Public Code Layer import fixture</title>
    <style>
      body { margin: 0; padding: 32px; color: #172b4d; background: #f5f7fb; font: 16px system-ui, sans-serif; }
      main { max-width: 560px; margin: 0 auto; padding: 32px; border: 1px solid #dfe5ef; border-radius: 16px; background: white; }
      h1 { margin-top: 0; font-size: 28px; }
      .marker { color: #526580; font: 14px ui-monospace, monospace; }
      button { padding: 12px 20px; border: 0; border-radius: 8px; color: white; background: #295bdb; font: inherit; cursor: pointer; }
      label { display: flex; align-items: center; gap: 12px; margin-top: 24px; }
      input { width: 20px; height: 20px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Public GitHub import fixture</h1>
      <p class="marker">CODE_LAYER_FIXTURE_V1</p>
      <p id="counter" role="status" aria-live="polite">Counter value: 0</p>
      <button id="increment" type="button">Increment counter</button>
      <label><input id="enabled" type="checkbox">Enable fixture</label>
      <p id="fixture-status" role="status" aria-live="polite">Fixture status: disabled</p>
    </main>
    <script type="module">
      let counterValue = 0;
      const counter = document.getElementById('counter');
      const enabled = document.getElementById('enabled');
      const status = document.getElementById('fixture-status');
      document.getElementById('increment').addEventListener('click', () => {
        counterValue += 1;
        counter.textContent = `Counter value: ${counterValue}`;
      });
      enabled.addEventListener('change', () => {
        status.textContent = `Fixture status: ${enabled.checked ? 'enabled' : 'disabled'}`;
      });
    </script>
  </body>
</html>
